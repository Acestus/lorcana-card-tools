name: Scrape Lorcana Player

on:
  workflow_dispatch:
    inputs:
      lorcanaplayer_url:
        description: "LorcanaPlayer card list URL (e.g. https://lorcanaplayer.com/wilds-unknown-card-list-lorcana-set-12/)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape and commit card list
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: |
          python3 scripts/scrape_lorcana_site.py \
            "${{ github.event.inputs.lorcanaplayer_url }}" \
            assets/lorcana

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/lorcana/
          if git diff --cached --quiet; then
            echo "✅ No changes — output matches existing files"
          else
            git commit -m "chore: scrape lorcana card list $(date +%Y-%m-%d)

          Source: ${{ github.event.inputs.lorcanaplayer_url }}
          Triggered manually via workflow_dispatch."
            git push
          fi
