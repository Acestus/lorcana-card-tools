name: Copy to Violet

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: 'Source path on runner (SD card)'
        required: false
        default: '/media/acestus/INFUSE'
      destination_host:
        description: 'Destination host'
        required: false
        default: 'violet'
      destination_path:
        description: 'Destination path on host'
        required: false
        default: '/media/violet/movies01'
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'true'
      delete_extra:
        description: 'Delete extra files on destination (true/false)'
        required: false
        default: 'false'
      verbose:
        description: 'Verbose output (true/false)'
        required: false
        default: 'false'

jobs:
  copy:
    name: Copy to Violet
    runs-on: [self-hosted, violet]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure script is executable
        run: |
          chmod +x scripts/copy-to-violet.ps1

      - name: Run copy script
        # Use bash to build conditional flags then call the PowerShell script
        shell: bash
        run: |
          set -euo pipefail
          DRY="${{ github.event.inputs.dry_run }}"
          DEL="${{ github.event.inputs.delete_extra }}"
          VERB="${{ github.event.inputs.verbose }}"

          ARGS=("-SourcePath" "${{ github.event.inputs.source_path }}" \
                "-DestinationHost" "${{ github.event.inputs.destination_host }}" \
                "-DestinationPath" "${{ github.event.inputs.destination_path }}")

          if [ "${DRY,,}" = "true" ] || [ "${DRY,,}" = "1" ]; then
            ARGS+=("-DryRun")
          fi
          if [ "${DEL,,}" = "true" ] || [ "${DEL,,}" = "1" ]; then
            ARGS+=("-DeleteExtra")
          fi
          if [ "${VERB,,}" = "true" ] || [ "${VERB,,}" = "1" ]; then
            ARGS+=("-VerboseOutput")
          fi

          echo "Running: pwsh ./scripts/copy-to-violet.ps1 ${ARGS[*]}"
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass ./scripts/copy-to-violet.ps1 "${ARGS[@]}"
